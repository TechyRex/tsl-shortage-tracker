<!-- code-generator.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSL Code Generator</title>
    <style>
        :root {
            --tsl-red: #8B0000;
            --tsl-dark: #1a1a1a;
            --tsl-light: #f8f9fa;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(to right, var(--tsl-red), #a52a2a);
            color: white;
            padding: 1.5rem 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 2.5rem;
            color: white;
        }

        .company-name {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .back-link {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.3s;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.2);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .generator-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            color: var(--tsl-red);
            border-bottom: 2px solid var(--tsl-red);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #ddd;
            border-radius: var(--radius);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--tsl-red);
            box-shadow: 0 0 0 3px rgba(139, 0, 0, 0.1);
        }

        .generate-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(to right, var(--tsl-red), #a52a2a);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(139, 0, 0, 0.2);
        }

        .code-display {
            background: #f8f9fa;
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 2rem;
            display: none;
        }

        .code-display.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .generated-code {
            font-size: 2rem;
            font-weight: 700;
            color: var(--tsl-red);
            text-align: center;
            letter-spacing: 3px;
            margin: 1rem 0;
            padding: 1rem;
            background: white;
            border-radius: var(--radius);
            border: 2px dashed var(--tsl-red);
        }

        .code-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .detail-item {
            text-align: center;
            padding: 1rem;
            background: rgba(139, 0, 0, 0.1);
            border-radius: var(--radius);
        }

        .detail-label {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 0.5rem;
        }

        .detail-value {
            font-weight: 600;
            color: var(--tsl-red);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--tsl-red);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            background: var(--tsl-red);
            color: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .codes-list {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }

        .codes-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .codes-table th {
            background: var(--tsl-red);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
        }

        .codes-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #eee;
        }

        .codes-table tr:hover {
            background: #f8f9fa;
        }

        .status-active {
            color: #28a745;
            font-weight: 600;
        }

        .status-expired {
            color: #dc3545;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <i class="fas fa-key logo"></i>
                <div>
                    <h1 class="company-name">TSL CODE GENERATOR</h1>
                    <p>Admin Access Code Management</p>
                </div>
            </div>
            <a href="index.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Main Form
            </a>
        </header>

        <!-- Code Generator -->
        <div class="generator-container">
            <h2 class="section-title">
                <i class="fas fa-plus-circle"></i> Generate New Access Code
            </h2>
            
            <div class="form-group">
                <label class="form-label">Code Type</label>
                <select id="codeType" class="form-select">
                    <option value="admin">Admin Access</option>
                    <option value="viewer">View Only</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Expiration Duration</label>
                <select id="expiration" class="form-select">
                    <option value="24">24 Hours</option>
                    <option value="12">12 Hours</option>
                    <option value="6">6 Hours</option>
                    <option value="168">7 Days</option>
                </select>
            </div>
            
            <button type="button" class="generate-btn" id="generateBtn">
                <i class="fas fa-magic"></i> Generate Code
            </button>
            
            <!-- Generated Code Display -->
            <div class="code-display" id="codeDisplay">
                <h3 style="text-align: center; margin-bottom: 1rem;">Generated Access Code</h3>
                <div class="generated-code" id="generatedCode"></div>
                
                <div class="code-details">
                    <div class="detail-item">
                        <div class="detail-label">Type</div>
                        <div class="detail-value" id="displayType">Admin</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Expires In</div>
                        <div class="detail-value" id="displayExpires">24 Hours</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Generated On</div>
                        <div class="detail-value" id="displayGenerated">Just now</div>
                    </div>
                </div>
                
                <div style="text-align: center; margin-top: 1rem;">
                    <button type="button" class="generate-btn" id="copyBtn" style="background: #28a745;">
                        <i class="fas fa-copy"></i> Copy Code
                    </button>
                </div>
            </div>
        </div>

        <!-- Existing Codes List -->
        <div class="codes-list">
            <h2 class="section-title">
                <i class="fas fa-list"></i> Active Access Codes
            </h2>
            
            <div class="codes-table-container">
                <table class="codes-table" id="codesTable">
                    <thead>
                        <tr>
                            <th>Access Code</th>
                            <th>Type</th>
                            <th>Generated On</th>
                            <th>Expires At</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="codesTableBody">
                        <!-- Codes will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        const CODES_SHEET_URL = 'https://sheetdb.io/api/v1/eskh492nq8oq4';
        
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const copyBtn = document.getElementById('copyBtn');
            const codeDisplay = document.getElementById('codeDisplay');
            const generatedCode = document.getElementById('generatedCode');
            const displayType = document.getElementById('displayType');
            const displayExpires = document.getElementById('displayExpires');
            const displayGenerated = document.getElementById('displayGenerated');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const toast = document.getElementById('toast');
            
            // Load existing codes
            loadCodes();
            
            // Generate new code
            generateBtn.addEventListener('click', generateCode);
            
            // Copy code to clipboard
            copyBtn.addEventListener('click', copyCode);
            
            async function generateCode() {
                const codeType = document.getElementById('codeType').value;
                const expirationHours = parseInt(document.getElementById('expiration').value);
                
                showLoading();
                
                try {
                    // Generate alphanumeric code
                    const code = generateAlphanumericCode(8);
                    const generatedAt = new Date().toISOString();
                    const expiresAt = new Date(Date.now() + expirationHours * 60 * 60 * 1000).toISOString();
                    
                    // Save code to SheetDB
                    const codeData = {
                        code: code,
                        type: codeType,
                        generated_at: generatedAt,
                        expires_at: expiresAt,
                        status: 'active'
                    };
                    
                    const response = await fetch(CODES_SHEET_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ data: [codeData] })
                    });
                    
                    if (response.ok) {
                        // Display generated code
                        generatedCode.textContent = code;
                        displayType.textContent = codeType === 'admin' ? 'Admin Access' : 'View Only';
                        displayExpires.textContent = `${expirationHours} Hours`;
                        displayGenerated.textContent = new Date().toLocaleString();
                        
                        codeDisplay.classList.add('show');
                        
                        showToast('Access code generated successfully!');
                        
                        // Reload codes list
                        loadCodes();
                    } else {
                        throw new Error('Failed to save code');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showToast('Error generating code. Please try again.', 'error');
                } finally {
                    hideLoading();
                }
            }
            
            function generateAlphanumericCode(length) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let result = '';
                for (let i = 0; i < length; i++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return result;
            }
            
            async function loadCodes() {
                try {
                    const response = await fetch(CODES_SHEET_URL);
                    const codes = await response.json();
                    
                    const tbody = document.getElementById('codesTableBody');
                    tbody.innerHTML = '';
                    
                    const now = new Date();
                    
                    codes.forEach(code => {
                        const row = document.createElement('tr');
                        
                        const expiresAt = new Date(code.expires_at);
                        const isExpired = expiresAt < now;
                        
                        row.innerHTML = `
                            <td><strong>${code.code}</strong></td>
                            <td>${code.type === 'admin' ? 'Admin Access' : 'View Only'}</td>
                            <td>${new Date(code.generated_at).toLocaleDateString()}</td>
                            <td>${expiresAt.toLocaleDateString()} ${expiresAt.toLocaleTimeString()}</td>
                            <td class="${isExpired ? 'status-expired' : 'status-active'}">
                                ${isExpired ? 'Expired' : 'Active'}
                            </td>
                        `;
                        
                        tbody.appendChild(row);
                    });
                } catch (error) {
                    console.error('Error loading codes:', error);
                }
            }
            
            function copyCode() {
                const code = generatedCode.textContent;
                navigator.clipboard.writeText(code)
                    .then(() => {
                        showToast('Code copied to clipboard!');
                    })
                    .catch(err => {
                        console.error('Error copying code:', err);
                        showToast('Error copying code', 'error');
                    });
            }
            
            function showLoading() {
                loadingOverlay.style.display = 'flex';
            }
            
            function hideLoading() {
                loadingOverlay.style.display = 'none';
            }
            
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.style.background = type === 'success' ? 'var(--tsl-red)' : '#dc3545';
                toast.style.display = 'block';
                
                setTimeout(() => {
                    toast.style.display = 'none';
                }, 3000);
            }
        });
    </script>
</body>
</html>
